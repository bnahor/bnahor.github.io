<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The site moved from the project path /website/ to the user-site root.
         Copies of the résumé PDF already in circulation link to the old path,
         so this stub keeps those links working. Safe to delete once no
         published document points at /website/ any more. -->
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://bnahor.github.io/" />
    <meta http-equiv="refresh" content="0; url=/" />

    <!-- Social crawlers do not follow the refresh, so an old shared link still
         needs to resolve to a valid card. -->
    <meta property="og:title" content="Rohan Bahl — Founding Engineer at Cortex AI" />
    <meta property="og:url" content="https://bnahor.github.io/" />
    <meta property="og:image" content="https://bnahor.github.io/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bnahor.github.io/og-card.png" />
    <title>Rohan Bahl — moved</title>
    <script>
      // Carry the hash across so deep links such as /website/#projects survive.
      location.replace('/' + location.hash)
    </script>
  </head>
  <body>
    <p>This page moved to <a href="https://bnahor.github.io/">bnahor.github.io</a>.</p>
  </body>
</html>
